<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dryer Chamber Temperature Monitor - Central Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0f1d;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(0, 255, 204, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .portal-card {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 18px;
            padding: 40px 32px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 255, 204, 0.05);
        }
        .portal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            font-size: 0.72rem;
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 999px;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .portal-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffcc;
            animation: pulse-dot 2s infinite ease-in-out;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
        }
        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.45rem;
            color: #00ffcc;
            letter-spacing: 1.8px;
            margin-bottom: 8px;
            line-height: 1.35;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.88rem;
            margin-bottom: 30px;
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
        }
        .units-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 26px;
        }
        .unit-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(0, 255, 204, 0.18);
            padding: 16px 20px;
            border-radius: 12px;
            color: #f8fafc;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .unit-btn:hover {
            background: rgba(15, 30, 50, 0.95);
            border-color: #00ffcc;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 255, 204, 0.2);
            color: #ffffff;
        }
        .unit-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            gap: 3px;
        }
        .unit-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .unit-meta {
            font-size: 0.75rem;
            color: #64748b;
            font-family: 'Inter', sans-serif;
        }
        .unit-status-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .unit-tag {
            font-size: 0.72rem;
            font-family: 'Share Tech Mono', monospace;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.8px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        /* Checking state */
        .unit-tag.checking {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        /* Online state */
        .unit-tag.online {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
        }
        .unit-tag.online::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
            animation: pulse-dot 1.5s infinite;
        }
        /* Offline state */
        .unit-tag.offline {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }
        .unit-tag.offline::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
        }
        .footer-note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            font-family: 'Share Tech Mono', monospace;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .refresh-status {
            color: #00ffcc;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .refresh-status:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="portal-badge">CENTRAL TELEMETRY GATEWAY</div>
        <h1>DRYER CHAMBER TEMPERATURE MONITOR</h1>
        <p class="subtitle">Select monitoring unit to view live temperature telemetry, logs, and multi-chamber charts</p>

        <div class="units-list" id="unitsContainer">
            <!-- Unit 1 -->
            <a href="unit1/" class="unit-btn" id="btn-unit1">
                <div class="unit-info">
                    <span class="unit-title">📊 UNIT 1 MONITOR</span>
                    <span class="unit-meta" id="meta-unit1">Connecting telemetry...</span>
                </div>
                <div class="unit-status-wrap">
                    <span class="unit-tag checking" id="tag-unit1">CHECKING...</span>
                </div>
            </a>

            <!-- Unit 2 -->
            <a href="unit2/" class="unit-btn" id="btn-unit2">
                <div class="unit-info">
                    <span class="unit-title">📊 UNIT 2 MONITOR</span>
                    <span class="unit-meta" id="meta-unit2">Connecting telemetry...</span>
                </div>
                <div class="unit-status-wrap">
                    <span class="unit-tag checking" id="tag-unit2">CHECKING...</span>
                </div>
            </a>
            <!-- Additional units (e.g. unit3/, unit4/) can be added here -->
        </div>

        <div class="footer-note">
            <span>SECURE CLOUD TELEMETRY</span>
            <span id="refreshBtn" class="refresh-status" onclick="checkAllUnits()">↻ REFRESH STATUS</span>
        </div>
    </div>

    <script>
        // Configuration for all deployed monitoring units
        const UNITS = [
            {
                id: 'unit1',
                name: 'UNIT 1 MONITOR',
                path: 'unit1/',
                defaultGasUrl: 'https://script.google.com/macros/s/AKfycbyPCz4nLKpPu33zG4Ue5fDuzQrU37dhlCpDZxt-qcCxQiKj_1FUjdyGGy13l8pehrVijQ/exec'
            },
            {
                id: 'unit2',
                name: 'UNIT 2 MONITOR',
                path: 'unit2/',
                defaultGasUrl: 'https://script.google.com/macros/s/AKfycbwJj6MTesFg-zF4JDXNF7lCoiGAgO2hsCvbCwQrJ8qWbV_iC6Dficjuw3NL8EpzC74/exec'
            },
            // NEXT_UNIT_CONFIG
        ];

        // Format relative time elapsed (e.g., "Just now", "2m ago", "1h ago", "3d ago")
        function formatTimeAgo(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return 'Never seen';
            const diffSec = Math.max(0, Math.floor((Date.now() - dateObj.getTime()) / 1000));
            if (diffSec < 45) return 'Just now';
            if (diffSec < 90) return '1m ago';
            if (diffSec < 3600) return Math.floor(diffSec / 60) + 'm ago';
            if (diffSec < 86400) return Math.floor(diffSec / 3600) + 'h ago';
            return Math.floor(diffSec / 86400) + 'd ago';
        }

        // Universal GAS API Caller (Direct Fetch with JSONP Fallback)
        function fetchGasJsonp(url) {
            return new Promise((resolve, reject) => {
                const callbackName = 'portal_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
                const script = document.createElement('script');
                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error('Timeout'));
                }, 8000);

                function cleanup() {
                    clearTimeout(timer);
                    if (script.parentNode) script.parentNode.removeChild(script);
                    delete window[callbackName];
                }

                window[callbackName] = function(data) {
                    cleanup();
                    resolve(data);
                };

                script.onerror = function() {
                    cleanup();
                    reject(new Error('Network Error'));
                };

                const sep = url.includes('?') ? '&' : '?';
                script.src = url + sep + 'callback=' + callbackName;
                document.head.appendChild(script);
            });
        }

        async function fetchUnitData(gasUrl) {
            const endpoint = gasUrl + (gasUrl.includes('?') ? '&' : '?') + 'action=getDashboardData';
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6500);
                const resp = await fetch(endpoint, {
                    method: 'GET',
                    redirect: 'follow',
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (resp && (resp.ok || resp.status === 200)) {
                    const text = await resp.text();
                    if (text && (text.trim().startsWith('{') || text.trim().startsWith('['))) {
                        return JSON.parse(text);
                    }
                }
            } catch (e) {
                // Fetch failed or timed out, attempt JSONP fallback
            }
            return await fetchGasJsonp(endpoint);
        }

        async function checkUnit(unit) {
            const tagEl = document.getElementById('tag-' + unit.id);
            const metaEl = document.getElementById('meta-' + unit.id);
            if (!tagEl) return;

            // Check if user has a custom GAS URL saved in localStorage for this path
            const storageKey = 'CUSTOM_GAS_URL_' + (('/' + unit.path).replace(/[^a-zA-Z0-9]/g, '_'));
            const customUrl = localStorage.getItem(storageKey);
            const gasUrl = (customUrl && customUrl.startsWith('http')) ? customUrl : unit.defaultGasUrl;

            try {
                const data = await fetchUnitData(gasUrl);
                const parsed = (typeof data === 'string') ? JSON.parse(data) : data;

                let isOnline = false;
                let latestDate = null;

                if (parsed && parsed.meters && parsed.meters.length > 0) {
                    for (const m of parsed.meters) {
                        if (m.lastUpdated) {
                            const d = new Date(m.lastUpdated);
                            if (!isNaN(d.getTime())) {
                                if (!latestDate || d > latestDate) latestDate = d;
                            }
                        }
                        if (m.isOnline === true || m.status === 'ONLINE') {
                            isOnline = true;
                        }
                    }
                }

                // If last transmission was received within 5 minutes (300s), confirm online
                if (latestDate && (Date.now() - latestDate.getTime()) <= 300000) {
                    isOnline = true;
                } else {
                    isOnline = false;
                }

                if (isOnline) {
                    tagEl.className = 'unit-tag online';
                    tagEl.textContent = 'ONLINE';
                    if (metaEl) metaEl.textContent = '🟢 Telemetry Active • Updated ' + formatTimeAgo(latestDate);
                } else {
                    tagEl.className = 'unit-tag offline';
                    tagEl.textContent = 'OFFLINE';
                    if (metaEl) metaEl.textContent = '🔴 Disconnected • Last seen ' + formatTimeAgo(latestDate);
                }
            } catch (err) {
                tagEl.className = 'unit-tag offline';
                tagEl.textContent = 'OFFLINE';
                if (metaEl) metaEl.textContent = '🔴 Offline / No response from server';
            }
        }

        function checkAllUnits() {
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) refreshBtn.textContent = '↻ CHECKING...';

            const promises = UNITS.map(u => {
                const tagEl = document.getElementById('tag-' + u.id);
                if (tagEl && tagEl.className.indexOf('checking') === -1) {
                    tagEl.className = 'unit-tag checking';
                    tagEl.textContent = 'CHECKING...';
                }
                return checkUnit(u);
            });

            Promise.allSettled(promises).then(() => {
                if (refreshBtn) refreshBtn.textContent = '↻ REFRESH STATUS';
            });
        }

        // Run initial check on page load and periodically every 30 seconds
        document.addEventListener('DOMContentLoaded', () => {
            checkAllUnits();
            setInterval(checkAllUnits, 30000);
        });
    </script>
</body>
</html>
